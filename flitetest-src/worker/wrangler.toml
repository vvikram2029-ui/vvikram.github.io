name = "flitetest"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

# Free Workers AI (fallback chat model; also the only one if GEMINI_API_KEY is not set)
[ai]
binding = "AI"

[vars]
REPO = "https://omarsalmon.pages.dev"
ALLOWED_ORIGINS = "https://omarsalmon.pages.dev"
GEMINI_MODEL = "gemini-flash-latest"
AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
